<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rise · Download flight playground</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; overflow: hidden; background: #f5f5f4; color: #222;
    font: 12px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #stage { flex: 1; min-width: 0; position: relative; display: flex; align-items: center; justify-content: center; }
  #window {
    position: absolute; left: 0; top: 0; width: 1000px; height: 640px; transform-origin: 0 0;
    border-radius: 12px; overflow: hidden; cursor: default; user-select: none;
    box-shadow: 0 0 0 .5px rgba(0,0,0,.28), 0 22px 60px rgba(0,0,0,.2), 0 4px 14px rgba(0,0,0,.08);
    background: linear-gradient(var(--bg1), var(--bg2));
  }
  #window[data-theme="neutral"] { --bg1:#DFDFDF; --bg2:#E5E5E5; --text:#343434; --muted:#888787; --page:#FFFFFF; --hint:#B9B9B9; }
  #window[data-theme="rose"]    { --bg1:#F3D4D8; --bg2:#F3D4D8; --text:#42121F; --muted:#90777C; --page:#FFFFFF; --hint:#C9AEB3; }
  #window[data-theme="dark"]    { --bg1:#363636; --bg2:#2B2B2B; --text:#D1D1D1; --muted:#A0A1A0; --page:#1E1E1E; --hint:#5A5A5A; }
  .lights { position: absolute; left: 14px; top: 14px; display: flex; gap: 8px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.18); }
  .lights i:nth-child(1) { background: #FF5F57; } .lights i:nth-child(2) { background: #FEBC2E; } .lights i:nth-child(3) { background: #28C840; }
  #page {
    position: absolute; left: 228px; top: 6px; right: 6px; bottom: 6px; border-radius: 9.5px; background: var(--page);
    box-shadow: 0 1px 2px rgba(0,0,0,.14); cursor: pointer;
    display: flex; align-items: center; justify-content: center; color: var(--hint); font-size: 13px;
  }
  #archive {
    position: absolute; left: 10px; top: 601px; width: 28px; height: 28px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center; color: var(--text); transform-origin: 50% 75%;
  }
  #archive svg { width: 20px; height: 20px; overflow: visible; }
  #archive .solid { fill: var(--bg2); }
  #lid, #body { transform-box: fill-box; }
  #fx { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  #trace { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #trace path { fill: none; stroke: #2D7FF9; stroke-width: 1; stroke-dasharray: 3 4; opacity: .5; transition: opacity .9s; }
  #trace circle { fill: #2D7FF9; opacity: .5; transition: opacity .9s; }
  .dl { position: absolute; left: 0; top: 0; will-change: transform, opacity; filter: drop-shadow(0 1.5px 2.5px rgba(0,0,0,.22)); }
  .dl svg { display: block; width: 100%; height: 100%; }

  #panel { width: 330px; flex: none; overflow-y: auto; background: #fff; border-left: 1px solid #e3e3e3; padding: 14px 16px 24px; }
  #panel h1 { font-size: 13px; margin: 0 0 2px; }
  #panel .sub { color: #888; margin-bottom: 12px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; align-items: center; }
  button, select { font: inherit; border: 1px solid #d6d6d6; background: #fafafa; border-radius: 6px; padding: 4px 9px; cursor: pointer; }
  button:hover { background: #f0f0f0; } button.primary { background: #2D7FF9; border-color: #2D7FF9; color: #fff; }
  fieldset { border: none; border-top: 1px solid #eee; margin: 10px 0 0; padding: 10px 0 0; }
  legend { font-weight: 600; padding: 0 6px 0 0; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #666; }
  .ctl { display: grid; grid-template-columns: 1fr 64px; column-gap: 8px; align-items: center; margin: 5px 0 1px; }
  .ctl label { color: #333; }
  .ctl output { text-align: right; color: #666; font-variant-numeric: tabular-nums; }
  .ctl input[type=range] { grid-column: 1 / 3; width: 100%; margin: 2px 0 0; accent-color: #2D7FF9; }
  .ctl .note { grid-column: 1 / 3; color: #999; font-size: 11px; }
  #curve { display: block; margin: 6px 0 2px; background: #fafafa; border: 1px solid #eee; border-radius: 6px; }
  .check { display: flex; align-items: center; gap: 6px; }
  kbd { font: 11px ui-monospace, Menlo, monospace; background: #f1f1f1; border: 1px solid #ddd; border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
  #toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: rgba(0,0,0,.78); color: #fff; padding: 6px 12px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="window" data-theme="neutral">
    <div class="lights"><i></i><i></i><i></i></div>
    <div id="page">Click anywhere to start a download</div>
    <svg id="trace"></svg>
    <div id="fx"></div>
    <div id="archive" title="Downloads">
      <!-- Archive icon from Tabler Icons by Paweł Kuna (MIT): https://github.com/tabler/tabler-icons/blob/master/LICENSE
           Split into lid and box; both are filled with the sidebar color so a download dropping in disappears behind them. -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <g id="body">
          <path class="solid" d="M5 8v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8"/>
          <path d="M10 12h4"/>
        </g>
        <path id="lid" class="solid" d="M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2"/>
      </svg>
    </div>
  </div>
</div>

<div id="panel">
  <h1>Download flight</h1>
  <div class="sub">Click the page to spawn a download. <kbd>Space</kbd> replays the last throw, <kbd>R</kbd> throws from a random spot.</div>
  <div class="row">
    <button class="primary" id="replay">Replay</button>
    <button id="random">Random</button>
    <button id="reset">Reset defaults</button>
    <button id="copy">Copy values</button>
  </div>
  <div class="row">
    <select id="speed">
      <option value="1">Speed 1×</option><option value="0.5">Speed 0.5×</option>
      <option value="0.25">Speed 0.25×</option><option value="0.1">Speed 0.1×</option>
    </select>
    <select id="theme"><option value="neutral">Neutral</option><option value="rose">Rose</option><option value="dark">Dark</option></select>
    <label class="check"><input type="checkbox" id="showTrace"> Show path</label>
  </div>
  <div id="controls"></div>
</div>
<div id="toast"></div>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="download-fill" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#58A8FF"/><stop offset="1" stop-color="#1E74F0"/></linearGradient></defs></svg>

<script>
// Springs use SwiftUI/Core Animation's (perceptualDuration, bounce) parameters,
// so values tuned here map straight onto CASpringAnimation(perceptualDuration:bounce:).
const schema = [
  { group: 'Spawn', items: [
    ['size', 'Icon size', 16, 48, 1, 'pt', 28],
    ['popFrom', 'Pop-in starting scale', 0.2, 1, 0.01, '×', 0.5],
    ['popResponse', 'Pop spring duration', 0.1, 0.8, 0.01, 's', 0.28],
    ['popBounce', 'Pop spring bounce', 0, 0.8, 0.01, '', 0.3],
    ['launchDelay', 'Hold before launch', 0, 400, 5, 'ms', 0],
  ]},
  { group: 'Flight', items: [
    ['duration', 'Duration (600 pt throw)', 150, 1500, 10, 'ms', 560],
    ['distanceInfluence', 'Longer throws take longer', 0, 1, 0.01, '', 0.35],
    ['arcHeight', 'Arc height (of distance)', 0, 0.6, 0.01, '', 0.18],
    ['peakPos', 'Arc peak position', 0.1, 0.9, 0.01, '', 0.35],
    ['x1', 'Easing x1', 0, 1, 0.01, '', 0.42],
    ['y1', 'Easing y1', -0.5, 1.5, 0.01, '', 0],
    ['x2', 'Easing x2', 0, 1, 0.01, '', 0.72],
    ['y2', 'Easing y2', -0.5, 1.5, 0.01, '', 0.19],
  ], curve: true },
  { group: 'Shrink', items: [
    ['shrinkStart', 'Shrinking starts at', 0, 0.98, 0.01, '', 0.6],
    ['endScale', 'Size on arrival', 0.08, 1, 0.01, '×', 0.24],
    ['shrinkCurve', 'Shrink curve (1 = linear)', 0.4, 4, 0.05, '', 1.6],
  ]},
  { group: 'Lid', items: [
    ['lidOpenAt', 'Opens at (of flight)', 0, 1, 0.01, '', 0.55],
    ['lidAngle', 'Opening angle', 0, 50, 0.5, '°', 24],
    ['lidLift', 'Lift', 0, 5, 0.1, 'pt', 1.2],
    ['bodyAngle', 'Box tilts forward', 0, 30, 0.5, '°', 9],
    ['lidCloseDelay', 'Closes after landing', 0, 400, 5, 'ms', 70],
    ['lidResponse', 'Spring duration', 0.1, 0.8, 0.01, 's', 0.24],
    ['lidBounce', 'Spring bounce', 0, 0.8, 0.01, '', 0.25],
  ]},
  { group: 'Landing', items: [
    ['depth', 'Lands below the rim by', 0, 8, 0.1, 'pt', 4],
  ]},
  { group: 'Archive reaction', items: [
    ['kick', 'Push along the flight', 0, 8, 0.1, 'pt', 1.8],
    ['tilt', 'Tilt', 0, 25, 0.5, '°', 2],
    ['squash', 'Squash', 0, 0.4, 0.005, '', 0],
    ['dirInfluence', 'Follows flight direction', 0, 1, 0.01, '', 1],
    ['reactResponse', 'Spring duration', 0.15, 1, 0.01, 's', 0.34],
    ['reactBounce', 'Spring bounce', 0, 0.85, 0.01, '', 0.4],
  ]},
];
const defaults = Object.fromEntries(schema.flatMap(g => g.items.map(i => [i[0], i[6]])));
const storeKey = 'rise.downloadFlight.v2';
let P = { ...defaults, ...JSON.parse(localStorage.getItem(storeKey) || '{}') };

const win = document.getElementById('window'), page = document.getElementById('page'), fx = document.getElementById('fx');
const archive = document.getElementById('archive'), trace = document.getElementById('trace');
const W = 1000, H = 640, archiveCenter = { x: 24, y: H - 25 };
// The 20 pt glyph's 24-unit viewBox, centered in its 28 pt button; the box's rim sits at y = 8.
const glyph = { left: archiveCenter.x - 10, top: archiveCenter.y - 10, unit: 20/24 };
const rimY = glyph.top + 8*glyph.unit;
let scale = 1, speed = 1, simTime = 0, last = null;

// ----- Layout --------------------------------------------------------------
function fit() {
  const stage = document.getElementById('stage').getBoundingClientRect();
  scale = Math.min(1, (stage.width - 48) / W, (stage.height - 48) / H);
  win.style.transform = `scale(${scale})`;
  win.style.left = `${(stage.width - W*scale)/2}px`; win.style.top = `${(stage.height - H*scale)/2}px`;
}
addEventListener('resize', fit); fit();

// ----- Math ----------------------------------------------------------------
function cubicBezier(x1, y1, x2, y2) {
  const cx = 3*x1, bx = 3*(x2-x1)-cx, ax = 1-cx-bx, cy = 3*y1, by = 3*(y2-y1)-cy, ay = 1-cy-by;
  const sx = t => ((ax*t+bx)*t+cx)*t, sy = t => ((ay*t+by)*t+cy)*t, dsx = t => (3*ax*t+2*bx)*t+cx;
  return x => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++) { const e = sx(t)-x, d = dsx(t); if (Math.abs(e) < 1e-6 || Math.abs(d) < 1e-6) break; t -= e/d; }
    if (!(t >= 0 && t <= 1) || Math.abs(sx(t)-x) > 1e-4) {
      let lo = 0, hi = 1; t = x;
      for (let i = 0; i < 40; i++) { if (sx(t) < x) lo = t; else hi = t; t = (lo+hi)/2; }
    }
    return sy(t);
  };
}
const lerp = (a, b, t) => a + (b-a)*t;
const smoothstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x-a)/(b-a))); return t*t*(3-2*t); };
const quad = (a, c, b, t) => ({ x: (1-t)*(1-t)*a.x + 2*(1-t)*t*c.x + t*t*b.x, y: (1-t)*(1-t)*a.y + 2*(1-t)*t*c.y + t*t*b.y });

class Spring {
  constructor(value = 0) { this.x = value; this.v = 0; this.target = value; }
  configure(response, bounce) {
    const damping = 1 - Math.min(0.95, Math.max(0, bounce));
    this.k = (2*Math.PI/response)**2; this.c = 4*Math.PI*damping/response;
  }
  step(dt) {
    for (let left = dt; left > 0; left -= 0.001) {
      const h = Math.min(0.001, left);
      this.v += (-this.k*(this.x-this.target) - this.c*this.v)*h; this.x += this.v*h;
    }
  }
  get resting() { return Math.abs(this.x-this.target) < 1e-4 && Math.abs(this.v) < 1e-3; }
}
// Peak displacement of a spring given a unit velocity kick, so "Push" reads in points.
function unitPeak(response, bounce) {
  const s = new Spring(0); s.configure(response, bounce); s.v = 1; let peak = 0;
  for (let t = 0; t < 2; t += 0.004) { s.step(0.004); peak = Math.max(peak, Math.abs(s.x)); }
  return peak || 1;
}

// ----- Archive icon reaction -----------------------------------------------
const react = { ox: new Spring(), oy: new Spring(), rot: new Spring(), sq: new Spring() };
function configureReact() { Object.values(react).forEach(s => s.configure(P.reactResponse, P.reactBounce)); }
configureReact();
function kickArchive(dir) {
  configureReact();
  const toward = { x: lerp(0, dir.x, P.dirInfluence), y: lerp(1, dir.y, P.dirInfluence) };
  const len = Math.hypot(toward.x, toward.y) || 1, r = { x: toward.x/len, y: toward.y/len };
  const v = 1/unitPeak(P.reactResponse, P.reactBounce);
  react.ox.v += v*r.x*P.kick; react.oy.v += v*r.y*P.kick;
  react.rot.v += v*r.x*P.tilt; react.sq.v += v*Math.max(0, r.y)*P.squash;
}
function renderArchive() {
  const sq = react.sq.x;
  archive.style.transform = `translate(${react.ox.x}px, ${react.oy.x}px) rotate(${react.rot.x}deg) scale(${1 + sq*0.45}, ${1 - sq})`;
}

// ----- Lid -----------------------------------------------------------------
// Hinged on the side away from the incoming download, so it opens toward it.
// The box shares its spring, tipping the other way.
// A closing lid stops against the box instead of swinging through it.
const lid = { spring: new Spring(0), hinge: 'left', closeAt: 0, el: document.getElementById('lid'), body: document.getElementById('body') };
function updateLid(dt) {
  lid.spring.configure(P.lidResponse, P.lidBounce);
  const now = simTime;
  const waiting = flights.find(f => !f.impacted && now - f.start - f.params.launchDelay/1000 >= f.dur*f.params.lidOpenAt);
  const settling = now < lid.closeAt;
  if (waiting && lid.spring.target === 0) lid.hinge = waiting.dir.x < 0 ? 'left' : 'right';
  lid.spring.target = waiting || settling ? 1 : 0;
  lid.spring.step(dt);
  if (lid.spring.x < 0) { lid.spring.x = 0; lid.spring.v = Math.max(0, lid.spring.v); }
  const open = lid.spring.x, angle = open*P.lidAngle*(lid.hinge === 'left' ? -1 : 1);
  lid.el.style.transformOrigin = lid.hinge === 'left' ? '0% 100%' : '100% 100%';
  lid.el.style.transform = `translateY(${-open*P.lidLift/glyph.unit}px) rotate(${angle}deg)`;
  // Like a jaw, the box tips forward from the lid's hinge side, widening the opening toward the download.
  lid.body.style.transformOrigin = lid.hinge === 'left' ? '0% 0%' : '100% 0%';
  lid.body.style.transform = `rotate(${-angle/P.lidAngle*P.bodyAngle || 0}deg)`;
}

// ----- Flights -------------------------------------------------------------
const flights = [];
const iconSVG = `<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="url(#download-fill)"/><circle cx="16" cy="16" r="14.5" fill="none" stroke="rgba(255,255,255,.25)"/>
  <path d="M16 8.6v13.2M10.6 16.6l5.4 5.4 5.4-5.4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function throwFrom(p0) {
  last = { ...p0 };
  const entry = { x: archiveCenter.x, y: rimY + P.depth };
  const dx = entry.x - p0.x, dy = entry.y - p0.y, len = Math.hypot(dx, dy) || 1;
  // Bulge the arc upward; the control point sits at twice the desired apex height.
  let n = { x: dy/len, y: -dx/len }; if (n.y > 0) n = { x: -n.x, y: -n.y };
  const base = { x: lerp(p0.x, entry.x, P.peakPos), y: lerp(p0.y, entry.y, P.peakPos) };
  const ctrl = { x: base.x + n.x*P.arcHeight*len*2, y: base.y + n.y*P.arcHeight*len*2 };
  const tl = Math.hypot(entry.x-ctrl.x, entry.y-ctrl.y) || 1;
  const el = document.createElement('div'); el.className = 'dl'; el.innerHTML = iconSVG;
  el.style.width = el.style.height = `${P.size}px`; fx.appendChild(el);
  const pop = new Spring(P.popFrom); pop.target = 1; pop.configure(P.popResponse, P.popBounce);
  const f = {
    el, p0, ctrl, entry, start: simTime, pop, impacted: false,
    dir: { x: (entry.x-ctrl.x)/tl, y: (entry.y-ctrl.y)/tl },
    dur: P.duration/1000 * Math.pow(len/600, P.distanceInfluence),
    ease: cubicBezier(P.x1, P.y1, P.x2, P.y2), params: { ...P },
  };
  flights.push(f);
  if (document.getElementById('showTrace').checked) drawTrace(f);
  render(f);
}
function drawTrace(f) {
  const ns = 'http://www.w3.org/2000/svg';
  const path = document.createElementNS(ns, 'path');
  path.setAttribute('d', `M${f.p0.x} ${f.p0.y} Q${f.ctrl.x} ${f.ctrl.y} ${f.entry.x} ${f.entry.y}`);
  const dot = document.createElementNS(ns, 'circle'); dot.setAttribute('cx', f.entry.x); dot.setAttribute('cy', f.entry.y); dot.setAttribute('r', 2);
  trace.append(path, dot);
  setTimeout(() => { path.style.opacity = dot.style.opacity = 0; }, 1600/speed);
  setTimeout(() => { path.remove(); dot.remove(); }, 2600/speed);
}
function render(f) {
  const p = f.params, t = simTime - f.start, launch = p.launchDelay/1000;
  let pos, s, opacity = 1;
  if (t < launch) { pos = f.p0; s = 1; }
  else {
    const u = Math.min(1, (t-launch)/f.dur), e = f.ease(u);
    pos = quad(f.p0, f.ctrl, f.entry, e);
    const k = e <= p.shrinkStart ? 0 : (e-p.shrinkStart)/(1-p.shrinkStart);
    s = 1 + (p.endScale-1)*Math.pow(Math.min(1, Math.max(0, k)), p.shrinkCurve);
    // The box reacts the moment the download drops past its rim, pushed along the
    // direction it was travelling; the box's front then hides it on the way in.
    if (!f.impacted && (pos.y >= rimY || u >= 1)) {
      const tx = 2*(1-e)*(f.ctrl.x-f.p0.x) + 2*e*(f.entry.x-f.ctrl.x), ty = 2*(1-e)*(f.ctrl.y-f.p0.y) + 2*e*(f.entry.y-f.ctrl.y);
      const len = Math.hypot(tx, ty) || 1;
      f.impacted = true; lid.closeAt = Math.max(lid.closeAt, simTime + p.lidCloseDelay/1000); kickArchive({ x: tx/len, y: ty/len });
    }
    if (u >= 1) {
      const after = t - launch - f.dur;
      opacity = 1 - Math.min(1, after/0.06);
      if (after >= 0.06) f.done = true;
    }
  }
  s *= f.pop.x;
  f.el.style.opacity = opacity;
  f.el.style.transform = `translate3d(${pos.x - p.size/2}px, ${pos.y - p.size/2}px, 0) scale(${s})`;
}

// ----- Loop ----------------------------------------------------------------
let prev = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now-prev)/1000) * speed; prev = now; simTime += dt;
  for (const f of flights) { f.pop.step(dt); render(f); }
  for (let i = flights.length-1; i >= 0; i--) if (flights[i].done) { flights[i].el.remove(); flights.splice(i, 1); }
  updateLid(dt);
  Object.values(react).forEach(s => s.step(dt)); renderArchive();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ----- Input ---------------------------------------------------------------
function toWindow(e) { const r = win.getBoundingClientRect(); return { x: (e.clientX - r.left)/scale, y: (e.clientY - r.top)/scale }; }
page.addEventListener('mousedown', e => throwFrom(toWindow(e)));
function randomPoint() { return { x: 228 + 40 + Math.random()*(W-228-80), y: 46 + Math.random()*(H-92) }; }
document.getElementById('replay').onclick = () => throwFrom(last || { x: 640, y: 220 });
document.getElementById('random').onclick = () => throwFrom(randomPoint());
document.getElementById('speed').onchange = e => speed = +e.target.value;
document.getElementById('theme').onchange = e => win.dataset.theme = e.target.value;
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  if (e.code === 'Space') { e.preventDefault(); throwFrom(last || { x: 640, y: 220 }); }
  if (e.key === 'r' || e.key === 'R') throwFrom(randomPoint());
});

// ----- Controls ------------------------------------------------------------
const controls = document.getElementById('controls'), inputs = {};
const fmt = (v, step, unit) => `${(+v).toFixed(step < 0.01 ? 3 : step < 0.1 ? 2 : step < 1 ? 1 : 0)}${unit && unit !== '' ? (unit === '×' || unit === '°' ? unit : ' ' + unit) : ''}`;
let curveCanvas;
for (const g of schema) {
  const fs = document.createElement('fieldset'); fs.innerHTML = `<legend>${g.group}</legend>`;
  for (const [key, label, min, max, step, unit] of g.items) {
    const wrap = document.createElement('div'); wrap.className = 'ctl';
    wrap.innerHTML = `<label for="c-${key}">${label}</label><output></output><input id="c-${key}" type="range" min="${min}" max="${max}" step="${step}">`;
    const input = wrap.querySelector('input'), out = wrap.querySelector('output');
    input.value = P[key]; out.textContent = fmt(P[key], step, unit);
    input.oninput = () => { P[key] = +input.value; out.textContent = fmt(P[key], step, unit); save(); if (g.curve) drawCurve(); };
    inputs[key] = { input, out, step, unit };
    fs.appendChild(wrap);
  }
  if (g.curve) { curveCanvas = document.createElement('canvas'); curveCanvas.id = 'curve'; fs.appendChild(curveCanvas); }
  controls.appendChild(fs);
}
function drawCurve() {
  const dpr = devicePixelRatio || 1, w = 296, h = 110;
  curveCanvas.width = w*dpr; curveCanvas.height = h*dpr; curveCanvas.style.width = w+'px'; curveCanvas.style.height = h+'px';
  const c = curveCanvas.getContext('2d'); c.scale(dpr, dpr); c.clearRect(0, 0, w, h);
  const pad = 14, X = x => pad + x*(w-2*pad), Y = y => h - pad - y*(h-2*pad)*0.8 - (h-2*pad)*0.1;
  c.strokeStyle = '#e5e5e5'; c.beginPath(); c.moveTo(X(0), Y(0)); c.lineTo(X(1), Y(0)); c.moveTo(X(0), Y(1)); c.lineTo(X(1), Y(1)); c.stroke();
  // Where shrinking begins, in eased progress.
  c.strokeStyle = 'rgba(45,127,249,.25)'; c.setLineDash([3, 3]); c.beginPath(); c.moveTo(X(0), Y(P.shrinkStart)); c.lineTo(X(1), Y(P.shrinkStart)); c.stroke(); c.setLineDash([]);
  c.strokeStyle = '#ccc'; c.beginPath(); c.moveTo(X(0), Y(0)); c.lineTo(X(P.x1), Y(P.y1)); c.moveTo(X(1), Y(1)); c.lineTo(X(P.x2), Y(P.y2)); c.stroke();
  c.strokeStyle = '#2D7FF9'; c.lineWidth = 2; c.beginPath(); const ease = cubicBezier(P.x1, P.y1, P.x2, P.y2);
  for (let i = 0; i <= 100; i++) { const x = i/100; i ? c.lineTo(X(x), Y(ease(x))) : c.moveTo(X(x), Y(ease(x))); } c.stroke();
  c.fillStyle = '#999'; c.font = '10px -apple-system'; c.fillText('progress along arc', pad, 11); c.fillText('time →', w - pad - 34, h - 2);
}
function sync() { for (const k in inputs) { inputs[k].input.value = P[k]; inputs[k].out.textContent = fmt(P[k], inputs[k].step, inputs[k].unit); } drawCurve(); }
function save() { localStorage.setItem(storeKey, JSON.stringify(P)); }
document.getElementById('reset').onclick = () => { P = { ...defaults }; save(); sync(); toast('Defaults restored'); };
document.getElementById('copy').onclick = async () => {
  const text = JSON.stringify(P, null, 2);
  try { await navigator.clipboard.writeText(text); toast('Values copied'); } catch { prompt('Copy these values', text); }
};
function toast(text) { const t = document.getElementById('toast'); t.textContent = text; t.style.opacity = 1; clearTimeout(toast.timer); toast.timer = setTimeout(() => t.style.opacity = 0, 1200); }
const shift = document.getElementById('showTrace'); shift.checked = localStorage.getItem(storeKey + '.trace') === '1';
shift.onchange = () => localStorage.setItem(storeKey + '.trace', shift.checked ? '1' : '0');
drawCurve();
</script>
</body>
